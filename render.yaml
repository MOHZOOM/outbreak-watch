services:
  - type: web
    name: outbreak-watch
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: outbreak_watch.db
      - key: AI_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
